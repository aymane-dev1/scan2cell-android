name: Build Scan2Cell Final APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed release APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Scan2Cell-Final-v1.0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Scan2Cell-Final-APK
          path: Scan2Cell-Final-v1.0.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Show compiler errors if build failed
        if: failure()
        shell: bash
        run: |
          echo "===== COMPILER ERRORS ====="
          grep -E "^(e:|error:)" build.log || tail -n 120 build.log
